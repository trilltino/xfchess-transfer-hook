# Manifest for hook-kit, the shared SPL Transfer Hook checks that every program compiles in.

[package]
name = "hook-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Transfer Hook protocol core shared by every hook in this repository: Execute checks, mint and token reads, canonical ExtraAccountMetaLists"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
spl-discriminator.workspace = true
spl-tlv-account-resolution.workspace = true
spl-transfer-hook-interface.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }
